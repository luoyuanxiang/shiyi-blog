name: 构建并推送到阿里云容器注册表

# 触发条件：推送到main分支或创建标签时触发
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检查代码
        uses: actions/checkout@v3

      - name: Set up JDK 1.8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: 使用 Maven 构建
        run: |
          cd blog
          mvn -B clean package -P prod --file pom.xml

      - name: 设置 node 版本
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: 构建前端包
        run: |
          cd blog-web
          npm install -g pnpm
          pnpm install
          npm run build

      - name: 构建后端包
        run: |
          cd blog-admin
          npm install -g pnpm
          pnpm install
          npm run build

      - name: 登录阿里云容器注册表
        uses: aliyun/acr-login@v1
        with:
          login-server: ${{ secrets.ALIYUN_ACR_REGISTRY }}  # 例如：registry.cn-beijing.aliyuncs.com
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: 构建和推送 Docker 镜像
        env:
          ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}  # 你的命名空间
          IMAGE_NAME: shiyi-blog  # 镜像名称
          DOCKER_VERSION: latest
        run: |
          cd blog
          # 构建镜像
          docker build -t $ACR_REGISTRY/$ACR_NAMESPACE/$IMAGE_NAME:$DOCKER_VERSION .
          
          # 如果是标签推送，额外添加latest标签
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            docker tag $ACR_REGISTRY/$ACR_NAMESPACE/$IMAGE_NAME:$DOCKER_VERSION $ACR_REGISTRY/$ACR_NAMESPACE/$IMAGE_NAME:$DOCKER_VERSION
            docker push $ACR_REGISTRY/$ACR_NAMESPACE/$IMAGE_NAME:latest
          fi
          
          # 推送版本标签镜像
          docker push $ACR_REGISTRY/$ACR_NAMESPACE/$IMAGE_NAME:$DOCKER_VERSION