server {
    listen 80;
    server_name localhost;
    gzip on;
    gzip_static on; # 需要http_gzip_static_module 模块
    gzip_min_length 1k;
    gzip_comp_level 4;
    gzip_proxied any;
    gzip_types text/plain text/xml text/css;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";

    # 根目录项目（主前端）
    root /var/www/frontend;  # 主项目打包后的dist目录
    index index.html;

    # 根目录项目（用户前台）
    location / {
        index index.html;

        # 支持 Vue History 模式路由
        try_files $uri $uri/ /index.html;

        # Vite 打包的静态资源通常在 assets 目录
        location ~* ^/assets/ {
            expires 30d;  # 静态资源缓存30天
            add_header Cache-Control "public, immutable";
        }
    }

    # Admin 项目（管理后台，通过 /admin 访问）
    location /admin {
        alias /var/www/admin/;  # 注意这里用 alias 而非 root
        index index.html;

        # 支持 Vue History 模式路由
        try_files $uri $uri/ /admin/index.html;

        # Admin 项目的静态资源缓存
        location ~* ^/admin/assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 禁止访问隐藏文件（如 .git、.env 等）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 处理 404 错误
    error_page 404 /index.html;

    # API请求代理到Spring Boot
    location ^~/api/ {
        proxy_pass http://localhost:8800/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~/websocket {
        proxy_pass http://localhost:8800;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 特定设置
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 60s;
    }
}

server {
    listen 443 ssl;
    server_name localhost;
    gzip on;
    gzip_static on; # 需要http_gzip_static_module 模块
    gzip_min_length 1k;
    gzip_comp_level 4;
    gzip_proxied any;
    gzip_types text/plain text/xml text/css;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";

    client_max_body_size 100g;
    ssl_certificate /etc/nginx/ssl/_.luoyuanxiang.top.pem;
    ssl_certificate_key /etc/nginx/ssl/_.luoyuanxiang.top.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;

    # 根目录项目（主前端）
    root /var/www/frontend;  # 主项目打包后的dist目录
